[workspace]
members = ["crates/capture-spike", "crates/shuttercrab", "crates/shuttercrab-capture", "crates/shuttercrab-platform"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Debug builds of GPUI and the text stack render slowly. Optimize them while
# the workspace's own crates stay quick, debuggable debug builds.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# GPUI's Windows layer with Shuttercrab's fix for graphics memory kept after
# windows close (vendor/gpui-pre-windows/SHUTTERCRAB.md). Remove once upstream
# has it.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
