# Formatting, Clippy and the tests. Runs on pull requests, on demand, and
# from the Release workflow before anything is tagged. Shuttercrab ships
# for Windows, and its GPU tests run on WARP, so a hosted Windows runner
# covers them. Linux and macOS have no full backend yet; their job keeps
# the code building there and runs the tests, Linux's X11 ones on a private
# X server (issue #49).

name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  other-os:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # What GPUI links against on Linux: X11 and Wayland, fonts, Vulkan.
      # Xvfb and openbox are the private X server the X11 tests run on.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libssl-dev libzstd-dev libvulkan1 xvfb openbox

      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      # Hotkeys, the clipboard and the windows on screen, against X11.
      - name: X11 tests
        if: runner.os == 'Linux'
        run: scripts/linux-x11-tests.sh

  # A Linux build of each pull request, to download and try on a desktop
  # (Ubuntu 24.04 first) while the Linux backend is built up. Not a release.
  linux-build:
    name: Linux build to try
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libssl-dev libzstd-dev libvulkan1

      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p shuttercrab

      # A tarball keeps the program executable through the artifact's zip.
      - name: Pack
        run: tar -czf shuttercrab-linux-x86_64.tar.gz -C target/release shuttercrab

      - uses: actions/upload-artifact@v7
        with:
          name: shuttercrab-linux-x86_64
          path: shuttercrab-linux-x86_64.tar.gz
          retention-days: 14
