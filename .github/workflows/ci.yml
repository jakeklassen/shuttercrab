# Formatting, Clippy and the tests. Runs on pull requests, and from the
# Release workflow before anything is tagged. Shuttercrab is Windows only,
# and its GPU tests run on WARP, so a hosted Windows runner covers them.

name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked
