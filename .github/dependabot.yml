# Weekly dependency updates. Minor and patch updates come together in one
# pull request; each major update comes on its own, so they are taken one at
# a time and one that cannot go yet holds back no other. Security updates
# still come as they are published.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]
      # windows-rs's crates only work at one version together.
      windows-rs:
        patterns: ["windows", "windows-*"]
        update-types: [major]

  # The meeting point's Worker.
  - package-ecosystem: npm
    directory: /meet
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      meet:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
