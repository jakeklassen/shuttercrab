[package]
name = "shuttercrab-stream"
version = "0.1.0"
description = "Live streaming (issue #66): a recording sent to a viewer as it is made, and the window that plays it"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
shuttercrab-capture = { path = "../shuttercrab-capture" }
shuttercrab-connect = { path = "../shuttercrab-connect" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
