[package]
name = "shuttercrab"
version = "0.1.33"
description = "A Windows 11 tray app for screenshots, screen recording and live streaming, whose SDR output looks right with HDR on"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "7"
shuttercrab-capture = { path = "../shuttercrab-capture" }
shuttercrab-platform = { path = "../shuttercrab-platform" }
shuttercrab-stream = { path = "../shuttercrab-stream" }
shuttercrab-types = { path = "../shuttercrab-types" }
futures = "0.3"
gpui-kit = "0.8.1"
# The version GPUI uses, so its RenderImage takes our frames.
image = { version = "0.25", default-features = false }
log = "0.4"
# Line ends and joins for strokes drawn live, as GPUI's own paths use.
lyon_tessellation = "1.0"
# Draws the emoji's SVG art, on the same tiny-skia as the marks.
resvg = { version = "0.49", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Draws marks onto screenshots, highlighter's multiply included.
# The version resvg draws on (emoji go from one onto the other), so it moves
# when resvg does.
tiny-skia = "0.12"
velopack = "1.2.161"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui-kit = { version = "0.8.1", features = ["test-support"] }

[lints]
workspace = true
