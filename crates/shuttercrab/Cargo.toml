[package]
name = "shuttercrab"
version = "0.1.4"
description = "A Windows 11 screenshot tool whose SDR output looks right with HDR on"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6"
shuttercrab-capture = { path = "../shuttercrab-capture" }
shuttercrab-platform = { path = "../shuttercrab-platform" }
futures = "0.3"
gpui-kit = "0.7.0"
# The version GPUI uses, so its RenderImage takes our frames.
image = { version = "0.25", default-features = false }
log = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
velopack = "1.2.161"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui-kit = { version = "0.7.0", features = ["test-support"] }

[lints]
workspace = true
