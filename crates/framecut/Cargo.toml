[package]
name = "framecut"
version = "0.1.0"
description = "A Windows 11 screenshot tool whose SDR output looks right with HDR on"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6"
framecut-capture = { path = "../framecut-capture" }
framecut-platform = { path = "../framecut-platform" }
futures = "0.3"
gpui-kit = "0.6.6"
# The version GPUI uses, so its RenderImage takes our frames.
image = { version = "0.25", default-features = false }
log = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui-kit = { version = "0.6.6", features = ["test-support"] }

[lints]
workspace = true
