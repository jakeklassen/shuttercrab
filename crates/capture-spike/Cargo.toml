[package]
name = "capture-spike"
version = "0.1.0"
description = "Milestone 0: prove Shuttercrab's HDR/WCG to SDR capture path"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
shuttercrab-capture = { path = "../shuttercrab-capture" }
shuttercrab-platform = { path = "../shuttercrab-platform" }
futures = "0.3"
half = "2.7"
png = "0.18"
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_HiDpi",
]

[lints]
workspace = true
