[package]
name = "capture-spike"
version = "0.1.0"
description = "Milestone 0: prove Framecut's HDR/WCG to SDR capture path"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
half = "2.7"
png = "0.18"
serde_json = "1"

# 0.62 is the version GPUI's Windows backend uses, so Direct3D objects can be
# shared with it in later milestones.
[dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Wdk_System_SystemServices",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
