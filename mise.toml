[tools]
rust = { version = "1.98.1", components = "clippy,rustfmt" }
# Builds libopus, for a live stream's sound, on Windows.
cmake = "4.4.0"

# Formatting, Clippy, the docs and the tests, as CI runs them, after
# trimming target/. Skips the one test that would signal the Shuttercrab
# you are running; CI runs it.
[tasks.check]
description = "Formatting, Clippy, the docs and the tests"
depends = ["trim"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --all-targets --locked -- -D warnings",
  { task = "doc" },
  "cargo test --locked -- --skip a_second_instance_signals_the_first",
]

# The docs, private items included, so a broken link fails the check.
[tasks.doc]
description = "The docs, failing on any warning"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --document-private-items --locked"

[tasks.trim]
description = "Empty target/ once it is past 30 GiB"
env = { TARGET_BUDGET_GIB = "30" }
run = "scripts/trim-target.sh"
run_windows = "pwsh -NoProfile -File scripts/trim-target.ps1"
